<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Address Book</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<body>
    <h1 th:text="'Address Book ' + ${addressBook.id}"></h1>

    <p>
        <a th:href="@{/}">Back to all address books</a>
    </p>

    <h2>Buddies</h2>

    <p th:if="${#lists.isEmpty(addressBook.buddies)}">
        This address book has no buddies.
    </p>

    <ul>
        <li th:each="buddy : ${addressBook.buddies}">
            <span th:text="${buddy.name}"></span>
            -
            <span th:text="${buddy.address}"></span>
            -
            <span th:text="${buddy.phoneNumber}"></span>
        </li>
    </ul>

    <h2>Add a Buddy</h2>

    <form th:action="@{/buddies(id=${addressBook.id})}" th:object="${buddyInfo}" method="post">
        <p>Name: <input type="text" th:field="*{name}" /></p>
        <p>Address: <input type="text" th:field="*{address}" /></p>
        <p>Phone Number: <input type="text" th:field="*{phoneNumber}" /></p>
        <p><input type="submit" value="Submit" /> <input type="reset" value="Reset" /></p>
    </form>

</body>
</html>
